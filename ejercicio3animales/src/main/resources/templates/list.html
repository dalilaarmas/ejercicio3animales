<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{fragments/nav :: mi-header}"></div>

<div class="container mt-4">
    <h2 class="h1">List of animals</h2>
    <a th:href="@{/animals/create}">Create New Animal</a>
    <table class="table table-hover">
        <th class="col">Id</th>
        <th class="col">Name</th>
        <th class="col">Average Lifespan</th>
        <th class="col">Extinct</th>
        <th class="col">Actions</th>
        <tr th:each="animal: ${animals}">
            <td th:text="${animal.id}">id</td>
            <td th:text="${animal.name}">name</td>
            <td th:text="${animal.averageLifespan}">lifespan</td>
            <td th:text="${animal.extinct} ? 'Yes' : 'No'">extinct</td>
            <td>
                <a class="btn btn-sm btn-outline-success text-decoration-none" th:href="@{animals/details(id=${animal.id})}">Details</a>
                <a class="btn btn-sm btn-outline-warning text-decoration-none" th:href="@{animals/edit/{id}(id=${animal.id})}">Edit</a>
                <a class="btn btn-sm btn-outline-danger text-decoration-none" th:href="@{/animals/delete/{id}(id=${animal.id})}">Delete</a>
            </td>

        </tr>
    </table>
</div>
</body>
</html>
