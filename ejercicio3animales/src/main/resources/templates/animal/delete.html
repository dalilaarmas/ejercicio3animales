<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{fragments/nav :: mi-header}"></div>
<div class="container mt-4">
    <h2 class="h1">Are you sure you want to delete this animal?</h2>
    <ul>
        <li>Id: <span th:text="${animal.id}">Id</span></li>
        <li>Name: <span th:text="${animal.name}">Name</span></li>
        <li>Lifespan: <span th:text="${animal.averageLifespan}">Lifespan</span></li>
        <li>Extinct: <span th:text="${animal.extinct} ? 'Yes' : 'No'">Extinct</span></li>
    </ul>
    <div class="d-flex gap-2">
        <form th:action="@{/animals/delete/{id}(id=${animal.id})}" method="post">
            <button type="submit" class="btn btn-sm btn-outline-primary">Delete</button>
        </form>
        <a class="btn btn-sm btn-outline-secondary text-decoration-none" th:href="@{/animals}">Cancel</a>
    </div>

</div>

</body>
</html>
