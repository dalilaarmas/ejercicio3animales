<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Create Animal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: mi-header}"></div>
<div class="container mt-4">
    <h2 class="h1">Edit Animal</h2>
    <form th:action="@{/animals/edit/{id}(id=${animal.id})}" th:object="${animal}" method="post">
        <input type="hidden" th:field="*{id}"/>
        <div class="form-group mb-3">
            <label for="name">Name</label>
            <input type="text" class="form-control" id="name" name="name" th:field="*{name}"/>
            <small class="text-danger" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name Error</small>
        </div>
        <div class="form-group mb-3">
            <label for="lifespan">Average Lifespan</label>
            <input type="number" class="form-control" id="lifespan" th:field="*{averageLifespan}">
            <small class="text-danger" th:if="${#fields.hasErrors('averageLifespan')}" th:errors="*{averageLifespan}">Lifespan Error</small>
        </div>
        <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="extinct" th:field="*{extinct}">
            <label class="form-check-label" for="extinct">Extinct animal</label>
            <small class="text-danger" th:if="${#fields.hasErrors('extinct')}" th:errors="*{extinct}">Extinct Error</small>
        </div>
        <button type="submit" class="btn btn-primary">Edit</button>
    </form>
    <a th:href="@{/animals}">Come back to the list</a>
</div>

</body>
</html>
