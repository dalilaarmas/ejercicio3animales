<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{fragments/nav :: mi-header}"></div>
<div class="container mt-4">
    <h2 class="h1">Are you sure you want to delete this Family?</h2>
    <ul>
        <li>Id: <span th:text="${family.id}">Id</span></li>
        <li>Name: <span th:text="${family.name}">Name</span></li>
    </ul>
    <h3 class="h2">Species in this Family:</h3>
    <ul>
        <li th:each="animal: ${family.animalList}">
            <span th:text="${animal.name}">Animal Name</span>
        </li>

    </ul>
    <div class="d-flex gap-2">
        <form th:action="@{/families/delete/{id}(id=${family.id})}" method="post">
            <button type="submit" class="btn btn-sm btn-outline-primary">Delete</button>
        </form>
        <a class="btn btn-sm btn-outline-secondary text-decoration-none" th:href="@{/families}">Cancel</a>
    </div>

</div>

</body>
</html>
