<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
<div th:replace="~{fragments/nav :: mi-header}"></div>

<div class="container mt-4">
    <h2 class="h1">List of Families</h2>
    <a th:href="@{/families/create}">Create New Family</a>
    <table class="table table-hover">
        <th class="col">Id</th>
        <th class="col">Name</th>
        <th class="col">Actions</th>
        <tr th:each="family: ${families}">
            <td th:text="${family.id}">id</td>
            <td th:text="${family.name}">name</td>
            <td>
                <a class="btn btn-sm btn-outline-success text-decoration-none" th:href="@{families/details(id=${family.id})}">Details</a>
                <a class="btn btn-sm btn-outline-warning text-decoration-none" th:href="@{families/edit/{id}(id=${family.id})}">Edit</a>
                <a class="btn btn-sm btn-outline-danger text-decoration-none" th:href="@{/families/delete/{id}(id=${family.id})}">Delete</a>
            </td>

        </tr>
    </table>
</div>
</body>
</html>
